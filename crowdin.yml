# Crowdin configuration for the ZCode UI strings.
# The TS tables are converted to flat JSON first:  pnpm i18n:export  (TS -> .crowdin/)
# then:  crowdin upload sources / crowdin download  and  pnpm i18n:import  (.crowdin/ -> TS).
# Credentials come from the environment, never from this file.
project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN
preserve_hierarchy: true

files:
  - source: /.crowdin/en-US.json
    translation: /.crowdin/translations/%locale%.json
    type: json
    skip_untranslated_strings: true
