# Sunsam Code: compila los instaladores de escritorio para Windows, Linux y macOS.
#
# - Se ejecuta en push a main (y ramas claude/**), en tags v*, en PRs hacia main y manualmente.
# - Los tags v* (o un commit con "[release]" en el mensaje) publican un GitHub Release con todos los instaladores.
# - Los builds no están firmados (sin certificados de Apple/Windows). En macOS, tras instalar:
#     xattr -rd com.apple.quarantine "/Applications/Sunsam Code.app"
name: Sunsam desktop build

on:
  push:
    # claude/** valida los instaladores (artefactos del run) antes de fusionar; sólo los tags publican Release.
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sunsam-desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24.14.0"
  ZCODE_ENV: production
  # Upstream usa espejos chinos por defecto; en runners de GitHub se usan los orígenes oficiales.
  ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
  ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
  ZCODE_NODE_DIST_MIRROR: https://nodejs.org/dist
  CSC_IDENTITY_AUTO_DISCOVERY: "false"
  ZCODE_ENABLE_MAC_SIGN: "0"

jobs:
  bundle:
    name: ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: win, arch: x64, runner: windows-latest }
          - { os: linux, arch: x64, runner: ubuntu-22.04 }
          - { os: linux, arch: arm64, runner: ubuntu-22.04-arm }
          - { os: mac, arch: arm64, runner: macos-14 }
          - { os: mac, arch: x64, runner: macos-15-intel }
    env:
      ZCODE_TARGET_OS: ${{ matrix.os }}
      ZCODE_TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Linux packaging tools (rpm, pacman)
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm -r --filter "./packages/*" --filter "!@zcode/desktop" build

      - name: Bundle desktop app
        run: pnpm bundle:desktop -- --os ${{ matrix.os }} --arch ${{ matrix.arch }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: sunsam-code-${{ matrix.os }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
            packages/desktop/dist/*.AppImage
            packages/desktop/dist/*.deb
            packages/desktop/dist/*.rpm
            packages/desktop/dist/*.pkg.tar.zst

  release:
    name: GitHub Release
    # Se publica aunque falle alguna plataforma: el Release lleva los instaladores que sí se generaron
    # y el log del job fallido indica qué falta.
    # También se publica desde un push cuyo mensaje de commit contenga "[release]" (el tag se crea aquí).
    if: ${{ !cancelled() && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]'))) }}
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: package.json
      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "name=v$(jq -r .version package.json)-sunsam.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: Sunsam Code ${{ steps.tag.outputs.name }}
          files: installers/*
          fail_on_unmatched_files: false
          make_latest: true
          generate_release_notes: true
          body: |
            Instaladores de **Sunsam Code** (sin firmar).

            | Sistema | Archivo |
            | --- | --- |
            | Windows x64 | `.exe` |
            | macOS Apple Silicon / Intel | `.dmg` (o `.zip`) `arm64` / `x64` |
            | Linux x64 / arm64 | `.AppImage`, `.deb`, `.rpm`, `.pkg.tar.zst` |

            macOS: tras copiar la app a Aplicaciones ejecuta `xattr -rd com.apple.quarantine "/Applications/Sunsam Code.app"`.
            Windows: SmartScreen → "Más información" → "Ejecutar de todas formas".

            Página del proyecto: https://jhonsu01.github.io/SunsamCode/
